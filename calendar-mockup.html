<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Community Calendar</title>
  <style>
    /* ── Reset & Base ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f8f9fb;
      --surface: #ffffff;
      --border: #e2e6ea;
      --text: #1a1d23;
      --muted: #6b7280;
      --primary: #4f46e5;
      --primary-light: #eef2ff;

      --service:  #0ea5e9;  --service-bg:  #e0f2fe;
      --event:    #f59e0b;  --event-bg:    #fef3c7;
      --leader:   #8b5cf6;  --leader-bg:   #ede9fe;
      --venture:  #10b981;  --venture-bg:  #d1fae5;

      --radius: 10px;
      --shadow: 0 1px 4px rgba(0,0,0,.07), 0 4px 16px rgba(0,0,0,.05);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── App Shell ────────────────────────────────────────────── */
    .app-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 60px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
      box-shadow: 0 1px 0 var(--border);
    }

    .header-left { display: flex; align-items: center; gap: 12px; }
    .logo {
      width: 32px; height: 32px; border-radius: 8px; background: var(--primary);
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 16px; font-weight: 700;
    }
    .app-title    { font-size: 17px; font-weight: 700; letter-spacing: -.3px; }
    .app-subtitle { font-size: 12px; color: var(--muted); }
    .header-right { display: flex; align-items: center; gap: 8px; }

    .btn { border: none; cursor: pointer; font-family: inherit; border-radius: 7px; font-weight: 500; transition: all .15s; }
    .btn-ghost { background: transparent; color: var(--muted); padding: 6px 10px; font-size: 13px; }
    .btn-ghost:hover { background: var(--bg); color: var(--text); }

    .sync-badge {
      display: flex; align-items: center; gap: 5px;
      background: #ecfdf5; color: #059669; border: 1px solid #a7f3d0;
      border-radius: 20px; padding: 3px 10px; font-size: 12px; font-weight: 500;
    }
    .sync-dot { width: 6px; height: 6px; border-radius: 50%; background: #10b981; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

    /* ── Toolbar ──────────────────────────────────────────────── */
    .toolbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 24px; gap: 12px; flex-wrap: wrap;
    }
    .toolbar-left { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

    .nav-group { display: flex; align-items: center; gap: 4px; }
    .nav-btn {
      width: 32px; height: 32px; border: 1px solid var(--border);
      background: var(--surface); border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 14px; color: var(--muted); transition: .15s;
    }
    .nav-btn:hover { background: var(--bg); color: var(--text); }
    .period-label { font-size: 17px; font-weight: 700; min-width: 160px; text-align: center; }

    .view-toggle { display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .view-btn {
      padding: 6px 14px; font-size: 13px; font-weight: 500;
      border: none; background: var(--surface); cursor: pointer; color: var(--muted); transition: .15s;
    }
    .view-btn.active { background: var(--primary); color: #fff; }
    .view-btn:not(.active):hover { background: var(--bg); }

    /* Filter pills */
    .filter-row {
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
      padding: 0 24px 14px;
    }
    .filter-label { font-size: 12px; color: var(--muted); font-weight: 500; margin-right: 4px; }
    .pill {
      padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600;
      border: 1.5px solid transparent; cursor: pointer; transition: .15s;
    }
    .pill-service { background: var(--service-bg); color: var(--service); border-color: var(--service); }
    .pill-event   { background: var(--event-bg);   color: var(--event);   border-color: var(--event); }
    .pill-leader  { background: var(--leader-bg);  color: var(--leader);  border-color: var(--leader); }
    .pill-venture { background: var(--venture-bg); color: var(--venture); border-color: var(--venture); }
    .pill.inactive { background: var(--bg); color: var(--muted); border-color: var(--border); }
    .pill:hover { opacity: .85; }

    /* ── Desktop Month Grid ───────────────────────────────────── */
    .calendar-wrap { padding: 0 24px 32px; }
    .cal-grid {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow);
    }
    .cal-days-header {
      display: grid; grid-template-columns: repeat(7, 1fr);
      border-bottom: 1px solid var(--border); background: var(--bg);
    }
    .cal-day-name {
      padding: 10px 0; text-align: center;
      font-size: 11px; font-weight: 700; color: var(--muted);
      letter-spacing: .06em; text-transform: uppercase;
    }
    .cal-weeks { display: flex; flex-direction: column; }
    .cal-week  { display: grid; grid-template-columns: repeat(7, 1fr); }
    .cal-week:not(:last-child) .cal-cell { border-bottom: 1px solid var(--border); }
    .cal-cell {
      min-height: 110px; padding: 8px;
      border-right: 1px solid var(--border); vertical-align: top;
    }
    .cal-cell:last-child { border-right: none; }
    .cal-cell.other-month .day-num { color: #d1d5db; }
    .cal-cell.today .day-num {
      background: var(--primary); color: #fff;
      width: 26px; height: 26px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; font-weight: 700;
    }
    .day-num {
      font-size: 13px; font-weight: 600; color: var(--text);
      width: 26px; height: 26px;
      display: flex; align-items: center; justify-content: center; margin-bottom: 4px;
    }
    .chip {
      font-size: 11px; font-weight: 600; border-radius: 4px; padding: 2px 6px;
      margin-bottom: 2px; cursor: pointer;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      max-width: 100%; transition: opacity .1s; display: block;
    }
    .chip:hover { opacity: .8; }
    .chip-service { background: var(--service-bg); color: var(--service); }
    .chip-event   { background: var(--event-bg);   color: var(--event); }
    .chip-leader  { background: var(--leader-bg);  color: var(--leader); }
    .chip-venture { background: var(--venture-bg); color: var(--venture); }
    .more-link { font-size: 11px; color: var(--primary); font-weight: 600; cursor: pointer; }

    /* ── Mobile Week View ─────────────────────────────────────── */
    .week-view {
      display: none;
      flex-direction: column;
      margin: 0 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      margin-bottom: 32px;
    }
    .week-view.active { display: flex; }

    .week-row {
      display: flex;
      align-items: flex-start;
      padding: 11px 14px;
      gap: 12px;
      min-height: 56px;
    }
    .week-row:not(:last-child) { border-bottom: 1px solid var(--border); }
    .week-row.today { background: var(--primary-light); }

    .week-day-col {
      display: flex; flex-direction: column; align-items: center;
      width: 42px; flex-shrink: 0; padding-top: 1px;
    }
    .week-day-name {
      font-size: 10px; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: .06em;
    }
    .week-day-num {
      width: 34px; height: 34px; margin-top: 3px;
      display: flex; align-items: center; justify-content: center;
      font-size: 19px; font-weight: 800; border-radius: 50%; color: var(--text);
    }
    .week-row.today .week-day-name { color: var(--primary); }
    .week-row.today .week-day-num  { background: var(--primary); color: #fff; }
    .week-row.other-month .week-day-name,
    .week-row.other-month .week-day-num { color: #d1d5db; }

    .week-divider { width: 1px; background: var(--border); align-self: stretch; flex-shrink: 0; }

    .week-events {
      flex: 1; display: flex; flex-direction: column; gap: 5px;
      padding-top: 7px; min-width: 0;
    }
    .week-empty { font-size: 12px; color: #d1d5db; padding-top: 9px; }

    .week-chip {
      font-size: 12px; font-weight: 600; border-radius: 6px; padding: 5px 10px;
      cursor: pointer; transition: opacity .1s;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .week-chip:hover { opacity: .8; }
    .week-chip-service { background: var(--service-bg); color: var(--service); }
    .week-chip-event   { background: var(--event-bg);   color: var(--event); }
    .week-chip-leader  { background: var(--leader-bg);  color: var(--leader); }
    .week-chip-venture { background: var(--venture-bg); color: var(--venture); }

    /* ── List View ────────────────────────────────────────────── */
    .list-view { padding: 0 24px 32px; display: none; flex-direction: column; gap: 16px; }
    .list-view.active { display: flex; }
    .calendar-wrap.hidden { display: none; }

    .month-group-title {
      font-size: 13px; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: .07em;
      padding-bottom: 8px; border-bottom: 1px solid var(--border);
    }
    .event-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 14px 16px;
      box-shadow: var(--shadow); cursor: pointer;
      display: flex; gap: 14px; align-items: flex-start;
      transition: box-shadow .15s, transform .15s;
    }
    .event-card:hover { box-shadow: 0 4px 20px rgba(0,0,0,.1); transform: translateY(-1px); }
    .event-date-block { text-align: center; min-width: 44px; display: flex; flex-direction: column; align-items: center; }
    .date-month { font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--muted); }
    .date-day   { font-size: 24px; font-weight: 800; line-height: 1; color: var(--text); }
    .date-dow   { font-size: 10px; color: var(--muted); }
    .event-content { flex: 1; min-width: 0; }
    .event-name  { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
    .event-meta  { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
    .event-detail-preview { font-size: 13px; color: var(--muted); line-height: 1.5;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .type-badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 700;
    }

    /* ── Event Detail Modal ───────────────────────────────────── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(15,20,30,.45); backdrop-filter: blur(2px);
      z-index: 200; display: flex; align-items: center; justify-content: center;
      padding: 24px; opacity: 0; pointer-events: none; transition: opacity .2s;
    }
    .modal-overlay.open { opacity: 1; pointer-events: all; }
    .modal {
      background: var(--surface); border-radius: 14px;
      width: 100%; max-width: 420px;
      box-shadow: 0 20px 60px rgba(0,0,0,.2);
      transform: translateY(12px); transition: transform .2s; overflow: hidden;
    }
    .modal-overlay.open .modal { transform: translateY(0); }
    .modal-header {
      padding: 20px 20px 0;
      display: flex; justify-content: space-between; align-items: flex-start;
    }
    .modal-title { font-size: 18px; font-weight: 700; line-height: 1.3; }
    .close-btn {
      width: 28px; height: 28px; border-radius: 50%; border: none;
      background: var(--bg); cursor: pointer; font-size: 16px; color: var(--muted);
      flex-shrink: 0; margin-left: 12px;
    }
    .close-btn:hover { background: var(--border); }
    .modal-body { padding: 16px 20px 24px; display: flex; flex-direction: column; gap: 12px; }
    .meta-row { display: flex; align-items: center; gap: 8px; }
    .meta-icon { font-size: 15px; width: 20px; text-align: center; }
    .meta-text { font-size: 14px; color: var(--muted); }
    .detail-box {
      background: var(--bg); border-radius: 8px; padding: 12px 14px;
      font-size: 13px; line-height: 1.6; color: var(--text);
    }

    /* ── Mobile Overrides ─────────────────────────────────────── */
    @media (max-width: 640px) {
      .app-header { padding: 0 14px; }
      .app-subtitle, .sync-badge { display: none; }
      .toolbar { padding: 12px 14px; gap: 8px; }
      .toolbar-left { width: 100%; justify-content: space-between; }
      .filter-row { padding: 0 14px 12px; gap: 5px; }
      .list-view { padding: 0 14px 24px; }
      .period-label { font-size: 14px; min-width: 130px; }
      .modal { max-width: 100%; }
      .modal-overlay { padding: 12px; align-items: flex-end; }
      .modal { border-radius: 18px 18px 0 0; }
      .event-card { padding: 12px 14px; }
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>

<!-- ══ Header ══════════════════════════════════════════════════ -->
<header class="app-header">
  <div class="header-left">
    <div class="logo">C</div>
    <div>
      <div class="app-title">Community Calendar</div>
      <div class="app-subtitle">Synced from Google Sheets</div>
    </div>
  </div>
  <div class="header-right">
    <div class="sync-badge"><div class="sync-dot"></div> Live</div>
    <button class="btn btn-ghost">⚙ Settings</button>
  </div>
</header>

<!-- ══ Toolbar ═════════════════════════════════════════════════ -->
<div class="toolbar">
  <div class="toolbar-left">
    <div class="nav-group">
      <button class="nav-btn" onclick="shift(-1)">‹</button>
      <div class="period-label" id="periodLabel">June 2026</div>
      <button class="nav-btn" onclick="shift(1)">›</button>
    </div>
    <button class="btn btn-ghost" onclick="goToday()">Today</button>
  </div>
  <div class="view-toggle">
    <button class="view-btn active" id="calBtn"  onclick="setView('cal')">Month</button>
    <button class="view-btn"        id="listBtn" onclick="setView('list')">List</button>
  </div>
</div>

<!-- Filter pills -->
<div class="filter-row">
  <span class="filter-label">Filter:</span>
  <span class="pill pill-service" data-type="Service" onclick="toggleFilter(this)">Service</span>
  <span class="pill pill-event"   data-type="Event"   onclick="toggleFilter(this)">Event</span>
  <span class="pill pill-leader"  data-type="Leader"  onclick="toggleFilter(this)">Leader</span>
  <span class="pill pill-venture" data-type="Venture" onclick="toggleFilter(this)">Venture</span>
</div>

<!-- ══ Desktop Month Grid ═══════════════════════════════════════ -->
<div class="calendar-wrap" id="calView">
  <div class="cal-grid">
    <div class="cal-days-header">
      <div class="cal-day-name">Sun</div>
      <div class="cal-day-name">Mon</div>
      <div class="cal-day-name">Tue</div>
      <div class="cal-day-name">Wed</div>
      <div class="cal-day-name">Thu</div>
      <div class="cal-day-name">Fri</div>
      <div class="cal-day-name">Sat</div>
    </div>
    <div class="cal-weeks" id="calWeeks"></div>
  </div>
</div>

<!-- ══ Mobile Week View ═════════════════════════════════════════ -->
<div class="week-view" id="weekView"></div>

<!-- ══ List View ════════════════════════════════════════════════ -->
<div class="list-view" id="listView"></div>

<!-- ══ Event Modal ══════════════════════════════════════════════ -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle"></div>
      <button class="close-btn" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="meta-row">
        <span class="meta-icon">🏷</span>
        <span class="meta-text">Type: </span>
        <span class="type-badge" id="modalType"></span>
      </div>
      <div class="meta-row">
        <span class="meta-icon">📅</span>
        <span class="meta-text" id="modalDate"></span>
      </div>
      <div class="detail-box" id="modalDetail"></div>
    </div>
  </div>
</div>

<script>
// ── Sample data (replace with Google Sheets fetch) ──────────────
const EVENTS = [
  { name:"Sunday Morning Service",  type:"Service", date:"2026-06-07", detail:"Weekly worship service at 10am. All are welcome. Nursery and kids' church available." },
  { name:"Youth Leadership Summit", type:"Leader",  date:"2026-06-08", detail:"Half-day intensive for youth leaders aged 16–25. Bring a notebook and your vision." },
  { name:"Community Cleanup Drive", type:"Service", date:"2026-06-13", detail:"Meet at the park at 8am. Gloves and bags provided. Help us beautify the neighborhood." },
  { name:"Summer Launch Party",     type:"Event",   date:"2026-06-14", detail:"Celebrate the start of summer programming. Food trucks, live music, and activities for all ages." },
  { name:"Venture Team Meeting",    type:"Venture", date:"2026-06-14", detail:"Q3 planning session for the Venture team. Review budgets and set project milestones." },
  { name:"Sunday Service",          type:"Service", date:"2026-06-14", detail:"Weekly worship. Special music by the choir this week." },
  { name:"Men's Breakfast",         type:"Event",   date:"2026-06-20", detail:"Monthly gathering for men of all ages. 7:30am at the main hall. $5 suggested donation." },
  { name:"Sunday Service",          type:"Service", date:"2026-06-21", detail:"Father's Day celebration service. Special recognition and message." },
  { name:"Women in Leadership",     type:"Leader",  date:"2026-06-22", detail:"Panel discussion and networking for women in ministry. Guest speaker Dr. Sarah Chen." },
  { name:"Food Pantry Volunteer",   type:"Service", date:"2026-06-24", detail:"Weekly food pantry operations. Volunteers needed 9am–1pm. Sign up in advance." },
  { name:"New Venture Pitch Night", type:"Venture", date:"2026-06-25", detail:"Teams present 5-minute pitches for new ministry ventures. Audience votes. Light refreshments." },
  { name:"Block Party",             type:"Event",   date:"2026-06-27", detail:"Annual neighborhood block party. Volunteer to run a booth or just come and enjoy!" },
  { name:"Sunday Service",          type:"Service", date:"2026-06-28", detail:"End-of-month celebration. Communion service. Please plan to stay for the full hour." },
  { name:"Leadership Retreat Info", type:"Leader",  date:"2026-06-28", detail:"Interest meeting for the July leadership retreat. Dates, logistics, and cost overview." },
  { name:"Habitat Build Day",       type:"Service", date:"2026-06-03", detail:"Join Habitat for Humanity for a build day. Training provided. Wear work clothes." },
  { name:"Venture Cohort Kickoff",  type:"Venture", date:"2026-06-09", detail:"Orientation for the new Venture cohort. Meet your mentors and set goals for the quarter." },
  { name:"Movie Night",             type:"Event",   date:"2026-06-19", detail:"Outdoor movie screening on the lawn. Bring blankets and chairs. Starts at dusk (~8:30pm)." },
];

const TYPE_COLORS = {
  Service: { cls:"service", label:"Service", icon:"🤝" },
  Event:   { cls:"event",   label:"Event",   icon:"🎉" },
  Leader:  { cls:"leader",  label:"Leader",  icon:"⭐" },
  Venture: { cls:"venture", label:"Venture", icon:"🚀" },
};

const monthNames = ["January","February","March","April","May","June",
                    "July","August","September","October","November","December"];
const dowFull    = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

let currentYear  = 2026;
let currentMonth = 5; // 0-indexed → June
let activeFilters = new Set(["Service","Event","Leader","Venture"]);
let currentView  = "cal";

// Monday of first week in June 2026 (June 1 is a Monday)
let currentWeekStart = new Date(2026, 5, 1);

// ── Helpers ──────────────────────────────────────────────────
function isMobile() { return window.innerWidth <= 640; }

function getMondayOf(date) {
  const d = new Date(date);
  d.setHours(0, 0, 0, 0);
  const dow = d.getDay();
  d.setDate(d.getDate() - (dow === 0 ? 6 : dow - 1));
  return d;
}

function dateStr(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function eventsForDate(ds) {
  return EVENTS.filter(e => e.date === ds && activeFilters.has(e.type));
}

function eventsForMonth(y, m) {
  const prefix = `${y}-${String(m+1).padStart(2,'0')}`;
  return EVENTS.filter(e => e.date.startsWith(prefix) && activeFilters.has(e.type))
               .sort((a,b) => a.date.localeCompare(b.date));
}

function fmtDate(ds) {
  const [y,m,d] = ds.split("-").map(Number);
  return new Date(y, m-1, d).toLocaleDateString("en-US",
    { weekday:"long", month:"long", day:"numeric", year:"numeric" });
}

function weekRangeLabel(monday) {
  const sunday = new Date(monday);
  sunday.setDate(sunday.getDate() + 6);
  const sm = monday.toLocaleDateString("en-US", { month:"short" });
  const em = sunday.toLocaleDateString("en-US", { month:"short" });
  const yr = sunday.getFullYear();
  if (sm === em) return `${sm} ${monday.getDate()} – ${sunday.getDate()}, ${yr}`;
  return `${sm} ${monday.getDate()} – ${em} ${sunday.getDate()}, ${yr}`;
}

// ── Desktop month render ──────────────────────────────────────
function renderCal() {
  document.getElementById("periodLabel").textContent =
    `${monthNames[currentMonth]} ${currentYear}`;

  const today = new Date();
  const todayDs = dateStr(today);
  const firstDay   = new Date(currentYear, currentMonth, 1).getDay();
  const daysInMonth = new Date(currentYear, currentMonth+1, 0).getDate();
  const daysInPrev  = new Date(currentYear, currentMonth, 0).getDate();

  const cells = [];
  for (let i = firstDay - 1; i >= 0; i--) {
    const m = currentMonth === 0 ? 11 : currentMonth - 1;
    const y = currentMonth === 0 ? currentYear - 1 : currentYear;
    cells.push({ day: daysInPrev - i, month: m, year: y, other: true });
  }
  for (let d = 1; d <= daysInMonth; d++) {
    cells.push({ day: d, month: currentMonth, year: currentYear, other: false });
  }
  while (cells.length % 7 !== 0) {
    const extra = cells.length - firstDay - daysInMonth + 1;
    const m = currentMonth === 11 ? 0 : currentMonth + 1;
    const y = currentMonth === 11 ? currentYear + 1 : currentYear;
    cells.push({ day: extra, month: m, year: y, other: true });
  }

  const weeksEl = document.getElementById("calWeeks");
  weeksEl.innerHTML = "";

  for (let w = 0; w < cells.length / 7; w++) {
    const weekEl = document.createElement("div");
    weekEl.className = "cal-week";
    for (let d = 0; d < 7; d++) {
      const c = cells[w * 7 + d];
      const ds = `${c.year}-${String(c.month+1).padStart(2,'0')}-${String(c.day).padStart(2,'0')}`;
      const evs = eventsForDate(ds);
      const cell = document.createElement("div");
      cell.className = "cal-cell" + (c.other ? " other-month" : "") + (ds === todayDs ? " today" : "");
      const num = document.createElement("div");
      num.className = "day-num";
      num.textContent = c.day;
      cell.appendChild(num);
      evs.slice(0, 2).forEach(ev => {
        const chip = document.createElement("div");
        chip.className = `chip chip-${TYPE_COLORS[ev.type].cls}`;
        chip.textContent = ev.name;
        chip.onclick = () => openModal(ev);
        cell.appendChild(chip);
      });
      if (evs.length > 2) {
        const more = document.createElement("div");
        more.className = "more-link";
        more.textContent = `+${evs.length - 2} more`;
        cell.appendChild(more);
      }
      weekEl.appendChild(cell);
    }
    weeksEl.appendChild(weekEl);
  }
}

// ── Mobile week render ────────────────────────────────────────
function renderWeek() {
  document.getElementById("periodLabel").textContent = weekRangeLabel(currentWeekStart);

  const today = new Date();
  today.setHours(0, 0, 0, 0);

  const weekEl = document.getElementById("weekView");
  weekEl.innerHTML = "";

  // Thursday of this week determines the "primary" month for other-month marking
  const thursday = new Date(currentWeekStart);
  thursday.setDate(thursday.getDate() + 3);

  for (let i = 0; i < 7; i++) {
    const day = new Date(currentWeekStart);
    day.setDate(day.getDate() + i);

    const ds     = dateStr(day);
    const evs    = eventsForDate(ds);
    const isToday      = day.getTime() === today.getTime();
    const isOtherMonth = day.getMonth() !== thursday.getMonth();

    const row = document.createElement("div");
    row.className = "week-row"
      + (isToday      ? " today"       : "")
      + (isOtherMonth ? " other-month" : "");

    // Day column
    const dayCol = document.createElement("div");
    dayCol.className = "week-day-col";
    dayCol.innerHTML = `
      <div class="week-day-name">${dowFull[day.getDay()]}</div>
      <div class="week-day-num">${day.getDate()}</div>`;

    // Vertical divider
    const divider = document.createElement("div");
    divider.className = "week-divider";

    // Events column
    const evsCol = document.createElement("div");
    evsCol.className = "week-events";

    if (evs.length === 0) {
      const empty = document.createElement("div");
      empty.className = "week-empty";
      empty.textContent = "No events";
      evsCol.appendChild(empty);
    } else {
      evs.forEach(ev => {
        const tc = TYPE_COLORS[ev.type];
        const chip = document.createElement("div");
        chip.className = `week-chip week-chip-${tc.cls}`;
        chip.textContent = `${tc.icon} ${ev.name}`;
        chip.onclick = () => openModal(ev);
        evsCol.appendChild(chip);
      });
    }

    row.appendChild(dayCol);
    row.appendChild(divider);
    row.appendChild(evsCol);
    weekEl.appendChild(row);
  }
}

// ── List render ───────────────────────────────────────────────
function renderList() {
  const evs = eventsForMonth(currentYear, currentMonth);
  const listEl = document.getElementById("listView");
  listEl.innerHTML = "";

  const title = document.createElement("div");
  title.className = "month-group-title";
  title.textContent = `${monthNames[currentMonth]} ${currentYear} — ${evs.length} event${evs.length !== 1 ? "s" : ""}`;
  listEl.appendChild(title);

  if (evs.length === 0) {
    const empty = document.createElement("div");
    empty.style.cssText = "text-align:center;padding:40px 0;color:var(--muted);font-size:14px";
    empty.textContent = "No events this month.";
    listEl.appendChild(empty);
    return;
  }

  evs.forEach(ev => {
    const [y,m,d] = ev.date.split("-").map(Number);
    const dt = new Date(y, m-1, d);
    const tc = TYPE_COLORS[ev.type];
    const card = document.createElement("div");
    card.className = "event-card";
    card.onclick = () => openModal(ev);
    card.innerHTML = `
      <div class="event-date-block">
        <div class="date-month">${monthNames[m-1].slice(0,3).toUpperCase()}</div>
        <div class="date-day">${d}</div>
        <div class="date-dow">${dowFull[dt.getDay()]}</div>
      </div>
      <div class="event-content">
        <div class="event-name">${ev.name}</div>
        <div class="event-meta">
          <span class="type-badge" style="background:var(--${tc.cls}-bg);color:var(--${tc.cls})">
            ${tc.icon} ${tc.label}
          </span>
        </div>
        <div class="event-detail-preview">${ev.detail}</div>
      </div>`;
    listEl.appendChild(card);
  });
}

// ── Master render ─────────────────────────────────────────────
function renderAll() {
  const mob     = isMobile();
  const showCal = currentView === "cal";

  document.getElementById("calView").classList.toggle("hidden",  !showCal || mob);
  document.getElementById("weekView").classList.toggle("active",  showCal && mob);
  document.getElementById("listView").classList.toggle("active", !showCal);
  document.getElementById("calBtn").classList.toggle("active",   showCal);
  document.getElementById("listBtn").classList.toggle("active",  !showCal);

  if (showCal) {
    if (mob) renderWeek(); else renderCal();
  } else {
    renderList();
  }
}

// ── Modal ─────────────────────────────────────────────────────
function openModal(ev) {
  const tc = TYPE_COLORS[ev.type];
  document.getElementById("modalTitle").textContent  = ev.name;
  document.getElementById("modalDate").innerHTML     = `<strong>${fmtDate(ev.date)}</strong>`;
  document.getElementById("modalDetail").textContent = ev.detail;
  const badge = document.getElementById("modalType");
  badge.textContent       = `${tc.icon} ${tc.label}`;
  badge.style.background  = `var(--${tc.cls}-bg)`;
  badge.style.color       = `var(--${tc.cls})`;
  document.getElementById("modalOverlay").classList.add("open");
}

function closeModal(e) {
  if (!e || e.target === document.getElementById("modalOverlay") || !e.target) {
    document.getElementById("modalOverlay").classList.remove("open");
  }
}

// ── Navigation ────────────────────────────────────────────────
function shift(dir) {
  if (isMobile() && currentView === "cal") {
    shiftWeek(dir);
  } else {
    shiftMonth(dir);
  }
}

function shiftMonth(dir) {
  currentMonth += dir;
  if (currentMonth > 11) { currentMonth = 0;  currentYear++; }
  if (currentMonth < 0)  { currentMonth = 11; currentYear--; }
  renderAll();
}

function shiftWeek(dir) {
  currentWeekStart.setDate(currentWeekStart.getDate() + dir * 7);
  // Sync month to the Thursday of the displayed week (ISO week convention)
  const thu = new Date(currentWeekStart);
  thu.setDate(thu.getDate() + 3);
  currentMonth = thu.getMonth();
  currentYear  = thu.getFullYear();
  renderAll();
}

function goToday() {
  const t = new Date();
  currentYear       = t.getFullYear();
  currentMonth      = t.getMonth();
  currentWeekStart  = getMondayOf(t);
  renderAll();
}

function setView(v) {
  currentView = v;
  renderAll();
}

function toggleFilter(el) {
  const t = el.dataset.type;
  if (activeFilters.has(t)) { activeFilters.delete(t); el.classList.add("inactive"); }
  else                       { activeFilters.add(t);    el.classList.remove("inactive"); }
  renderAll();
}

// ── Init ──────────────────────────────────────────────────────
renderAll();
window.addEventListener("resize", renderAll);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });
</script>
